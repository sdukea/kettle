[project]
name = "nue-agent"
version = "0.1.0"
description = "Nue translator: joins a call and translates each speaker for the other"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents>=1.0",
  "livekit-plugins-silero>=1.0",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
deepgram = ["livekit-plugins-deepgram>=1.0"]
elevenlabs = ["livekit-plugins-elevenlabs>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nue_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
